<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Practice | vprepcaa</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Pixelify+Sans:wght@500;600&family=Schibsted+Grotesk:wght@500;650;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/css/site.css">
<link rel="stylesheet" href="/css/dashboard.css">
<link rel="stylesheet" href="/css/practice.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="/"><img src="/favicon.svg" alt="" width="26" height="19">vprepcaa</a>
  <nav id="account-nav" aria-label="Account"></nav>
</header>
<main class="wide">
  <p id="banner" class="banner toast" role="status" hidden></p>
  <div id="pr" class="pr">
    <div class="setbar" id="setbar"><div class="skel" style="min-height:40px;width:100%"></div></div>
    <section class="card panel qcard" aria-label="Question" id="qcard"></section>
    <section class="card panel acard" aria-label="Your answer" id="acard"><div class="body" id="abody"></div></section>
  </div>
</main>
<dialog id="confirm" class="sheet-dialog" aria-labelledby="confirm-h">
  <div id="classes-wrap" style="padding:18px 20px">
    <h2 id="confirm-h" style="margin-top:0">Hand in your homework?</h2>
    <p id="confirm-text" class="muted"></p>
    <div class="actions-row"><button class="btn" id="confirm-yes" type="button">Hand it in</button><button class="btn btn-secondary" id="confirm-no" type="button">Keep working</button></div>
  </div>
</dialog>
<script type="module" src="/js/practice.js"></script>
</body>
</html>
