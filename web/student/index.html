<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My dashboard | vprepcaa</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Pixelify+Sans:wght@500;600&family=Schibsted+Grotesk:wght@500;650;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/css/site.css">
<link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="/"><img src="/favicon.svg" alt="" width="26" height="19">vprepcaa</a>
  <nav id="account-nav" aria-label="Account"></nav>
</header>
<main class="wide">
  <p id="banner" class="banner toast" role="status" hidden></p>
  <p id="who" class="muted small" hidden></p>

  <!-- Student dashboard (filled by /js/student.js). On a monitor it fills the
       window: the page doesn't scroll, long panels scroll inside themselves. -->
  <div id="dash" class="dash" hidden>
    <div class="a-hero" id="hero"><div class="skel"></div></div>
    <div class="a-tiles tiles" id="tiles"></div>

    <section class="card panel a-today" aria-labelledby="h-today">
      <div class="card-h"><h2 id="h-today">Today's questions</h2><span class="muted" id="today-date"></span></div>
      <div id="today-tabs"></div>
      <div id="today" class="body"></div>
    </section>

    <div class="a-mid stackcol">
      <section class="card panel hw-panel" aria-labelledby="h-hw">
        <div class="card-h"><h2 id="h-hw">Homework</h2><span class="muted" id="hw-count"></span></div>
        <div id="homework" class="body hw"></div>
      </section>
      <section class="card panel grow" aria-labelledby="h-prog">
        <div class="card-h"><h2 id="h-prog">Progress and chapters</h2><span class="muted small" id="prog-overall"></span></div>
        <div id="prog-head"></div>
        <div id="chapters" class="body"></div>
      </section>
    </div>

    <div class="a-right stackcol">
      <section class="card panel" aria-labelledby="h-streak">
        <div class="card-h"><h2 id="h-streak">Daily streak</h2><span class="muted small">Last 5 weeks</span></div>
        <div id="streak"></div>
      </section>
      <section class="card panel grow" aria-labelledby="h-recent">
        <div class="card-h"><h2 id="h-recent">Recent results</h2></div>
        <div id="recent" class="body results"></div>
      </section>
    </div>
  </div>

  <!-- Classes. Students open this from the header ("My classes"); teachers see it on the page. -->
  <dialog id="classes-dialog" class="sheet-dialog" aria-labelledby="classes-h">
    <div id="classes-wrap">
      <section id="classes-card" class="card classes-card" hidden>
        <div class="page-head"><h2 id="classes-h" style="margin:0">My classes</h2>
          <span class="row-gap"><button id="signout" class="btn btn-secondary btn-small" type="button">Sign out</button><button id="classes-close" class="btn btn-secondary btn-small" type="button" hidden>Close</button></span></div>
        <ul id="classes" class="class-list"></ul>
        <p id="no-classes" class="muted" hidden>You're not in any classes yet.</p>
      </section>

      <form id="join-form" class="card" novalidate hidden>
        <h2>Join a class</h2>
        <label for="join-code">Class code</label>
        <div class="code-row">
          <input id="join-code" class="code-input" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="8" placeholder="e.g. K7Q3MZ">
          <button class="btn" type="submit">Join</button>
        </div>
        <p id="join-message" class="form-message" role="alert"></p>
      </form>

      <form id="create-form" class="card" novalidate hidden>
        <h2>Create a class</h2>
        <p class="muted">You'll get a 6-character code to share with your students.</p>
        <label for="class-name">Class name</label>
        <input id="class-name" maxlength="60" placeholder="e.g. 12 General Maths A" required>
        <div class="form-row">
          <div>
            <label for="class-subject">Subject</label>
            <select id="class-subject" required></select>
          </div>
          <div>
            <label for="class-year">Year</label>
            <input id="class-year" type="number" min="2020" max="2100" required>
          </div>
        </div>
        <button class="btn" type="submit">Create class</button>
        <p id="create-message" class="form-message" role="alert"></p>
      </form>
    </div>
  </dialog>
  <div id="teacher-area"></div>
</main>
<script type="module" src="/js/student.js"></script>
</body>
</html>
